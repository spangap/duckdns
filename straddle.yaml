# duckdns — DuckDNS dynamic DNS client for spangap.
schema_version: 1
name: spangap/duckdns
prefix: duckdns
version: 0.1.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
  # duckdns.cpp unconditionally #include's "upnp.h"; hard dep until that
  # call site is gated on CONFIG_SPANGAP_UPNP.
  - spangap/upnp
optional_requires:
  # duckdns.cpp registers a Settings pane via lcdSetting* helpers,
  # gated on CONFIG_SPANGAP_LCD.
  - spangap/spangap-lcd
# Auto-init: folded into the buildable's generated spangapInitStraddles().
# duckdnsInit() registers net-event callbacks, a cron entry, and a CLI verb —
# order-independent once net/storage/cron/cli are up. Default order (100).
init:
  - call: duckdnsInit
