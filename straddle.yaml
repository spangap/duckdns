# duckdns — DuckDNS dynamic DNS client for spangap.
schema_version: 1
name: spangap/duckdns
prefix: duckdns
version: 0.0.0
firmware: esp-idf
browser: browser
platforms: [idf]
requires:
  - spangap/spangap-net
# upnp is an OPTIONAL integration, not a hard dep: duckdns.cpp's external-IP
# lookup (upnpExternalIp) is `#if CONFIG_SPANGAP_UPNP`, and DuckDNS auto-detects
# the public IP from the request when UPnP is absent. The build reads that #if
# cue and adds upnp to REQUIRES only when it's staged; no upnp → it compiles away.
# Auto-init: DuckdnsService::onInit is run by the buildable's generated boot
# dispatcher. It registers net-event callbacks, a cron entry, and a CLI verb —
# net/storage/cron/cli are all up by the time the straddle band runs.
services:
  - { class: DuckdnsService, header: duckdns.h }
# The DuckDNS pane's web half is now generated from the `settings:` block below
# (registered via the buildable's straddles.gen.ts registerGeneratedPanels), so
# this straddle no longer ships a browser module / browser_register hook.

# Declarative settings: the DuckDNS pane (LCD + web + storage defaults from one
# source). The token is `secret:` — masked on the LCD, write-only on the web.
settings:
  - at:
      - { id: net }
      - { id: reachable }
    order: 3
    rows:
      - heading: "Duck DNS"
      - caption: "Next you might to make the device reachable by name, not IP-number. One way is to register at the [Duck DNS website](https://www.duckdns.org/) and create an account and hostname there."
      - text:    { label: "Subdomain", key: "s.duckdns.domain", default: "", unit: ".duckdns.org" }
      - caption: "Only the subdomain (e.g. myname for myname.duckdns.org)"
      - text:    { label: "Token", key: "s.duckdns.token", default: "", secret: true }
      - caption: "Token from the Duck DNS dashboard."
